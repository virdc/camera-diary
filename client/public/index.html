<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />

    <!-- ✅ Viewport: mejor no bloquear zoom (accesibilidad + Play Store) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <meta name="theme-color" content="#0b0f19" />
    <meta name="color-scheme" content="dark" />

    <!-- ✅ PWA / iOS -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cuaderno de Cámara" />

    <!-- ✅ SEO / Compartir -->
    <meta name="description" content="Asistente fotográfico profesional: gestiona, anota y organiza tus sesiones de cámara." />
    <meta name="application-name" content="Cuaderno de Cámara" />

    <!-- ✅ Íconos SVG embebidos (browser + pantalla inicio) -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='105' fill='%230b0f19'/><circle cx='256' cy='256' r='110' fill='%23ff5722'/><circle cx='256' cy='256' r='75' fill='%230b0f19'/><circle cx='220' cy='220' r='20' fill='%23ffffff'/><path d='M150 110 h60 l30 -30 h132 l30 30 h60 a30 30 0 0 1 30 30 v230 a30 30 0 0 1 -30 30 H150 a30 30 0 0 1 -30 -30 V140 a30 30 0 0 1 30 -30 z' fill='none' stroke='%23ff5722' stroke-width='28'/></svg>"
    />
    <link
      rel="apple-touch-icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='105' fill='%230b0f19'/><circle cx='256' cy='256' r='110' fill='%23ff5722'/><circle cx='256' cy='256' r='75' fill='%230b0f19'/><circle cx='220' cy='220' r='20' fill='%23ffffff'/></svg>"
    />

    <!-- ✅ Manifest (relativo, no %PUBLIC_URL% en build) -->
    <link rel="manifest" href="/manifest.json" />

    <!-- ✅ Precarga de fuentes/estilos si aplica (opcional) -->
    <!-- <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /> -->

    <title>Cuaderno de Cámara · Asistente Fotográfico Pro</title>

    <!-- ✅ Estilos críticos inline para evitar FOUC -->
    <style>
      html, body { margin: 0; padding: 0; background: #0b0f19; color: #f8fafc; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        min-height: 100vh;
        min-height: 100dvh;
        overflow-x: hidden;
        -webkit-tap-highlight-color: transparent;
      }
      #root { min-height: 100vh; min-height: 100dvh; }
      /* Splash simple mientras React monta */
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0f19;
        z-index: 9999;
        transition: opacity .3s ease;
      }
      #splash svg { width: 96px; height: 96px; animation: pulse 1.4s ease-in-out infinite; }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.92); opacity: 0.7; }
      }
      #splash.hide { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <noscript>
      <div style="padding: 24px; font-family: sans-serif; text-align: center;">
        <h2>JavaScript requerido</h2>
        <p>Para usar Cuaderno de Cámara necesitas habilitar JavaScript en tu navegador.</p>
      </div>
    </noscript>

    <!-- ✅ Splash nativo (solo visible hasta que React monte) -->
    <div id="splash" aria-hidden="true">
      <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <circle cx="256" cy="256" r="110" fill="#ff5722" />
        <circle cx="256" cy="256" r="75" fill="#0b0f19" />
        <circle cx="220" cy="220" r="20" fill="#ffffff" />
      </svg>
    </div>

    <div id="root"></div>

    <!-- ✅ Script para ocultar splash cuando React monte -->
    <script>
      window.addEventListener('load', () => {
        const s = document.getElementById('splash');
        if (s) {
          setTimeout(() => s.classList.add('hide'), 300);
          setTimeout(() => s.remove(), 900);
        }
      });
      // Fallback por si algo falla
      setTimeout(() => {
        const s = document.getElementById('splash');
        if (s) s.remove();
      }, 4000);
    </script>
  </body>
</html>
